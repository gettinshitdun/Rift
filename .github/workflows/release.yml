name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Note: Currently builds for Linux only (uses epoll, not portable to macOS/kqueue)
  # TODO: Add cross-platform support with conditional compilation for kqueue
  build-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            artifact-suffix: linux-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build binaries
        run: |
          make clean && make

      - name: Create distribution packages
        run: |
          # Full distribution (with docs)
          mkdir -p rift-dist/bin
          cp rift-server rift-dist/bin/
          cp rift-client rift-dist/bin/
          cp README.md rift-dist/
          cp -r docs/ rift-dist/

          # Server-only distribution
          mkdir -p rift-server-dist/bin
          cp rift-server rift-server-dist/bin/
          cp README.md rift-server-dist/
          cp -r docs/ rift-server-dist/

          # Client-only distribution
          mkdir -p rift-client-dist/bin
          cp rift-client rift-client-dist/bin/
          cp README.md rift-client-dist/

      - name: Create tarballs
        run: |
          tar czf rift-${{ matrix.artifact-suffix }}.tar.gz rift-dist/
          tar czf rift-server-${{ matrix.artifact-suffix }}.tar.gz rift-server-dist/
          tar czf rift-client-${{ matrix.artifact-suffix }}.tar.gz rift-client-dist/
          ls -lh rift-*.tar.gz

      - name: Create checksums
        run: |
          shasum -a 256 rift-${{ matrix.artifact-suffix }}.tar.gz > rift-${{ matrix.artifact-suffix }}.tar.gz.sha256
          shasum -a 256 rift-server-${{ matrix.artifact-suffix }}.tar.gz > rift-server-${{ matrix.artifact-suffix }}.tar.gz.sha256
          shasum -a 256 rift-client-${{ matrix.artifact-suffix }}.tar.gz > rift-client-${{ matrix.artifact-suffix }}.tar.gz.sha256
          cat rift-*.tar.gz.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rift-builds
          path: |
            rift-*.tar.gz
            rift-*.tar.gz.sha256

  create-release:
    runs-on: ubuntu-latest
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: rift-builds
          path: ./releases

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: releases/*
          body: |
            # RIFT Release ${{ github.ref_name }}
            
            ## Changes
            See commit history for details.
            
            ## Installation
            
            Download the appropriate binary for your platform:
            - `rift-linux-x86_64.tar.gz` for Linux
            - `rift-macos-x86_64.tar.gz` for macOS
            
            ```bash
            tar xzf rift-<platform>.tar.gz
            cd rift-dist
            ./bin/rift-server
            ```
            
            ## Checksums
            
            Verify integrity:
            ```bash
            sha256sum -c rift-<platform>.tar.gz.sha256
            ```
          draft: false
          prerelease: false
