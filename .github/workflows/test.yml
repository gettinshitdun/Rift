name: RIFT Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No external Python dependencies needed for tests

      - name: Build RIFT server and client
        run: |
          cd ${{ github.workspace }}
          make clean && make
          echo "Build completed successfully"
          ls -lh rift-server rift-client

      - name: Start HTTP backend service on port 3000
        run: |
          cd /tmp
          python -m http.server 3000 > /tmp/http_server.log 2>&1 &
          sleep 2
          echo "HTTP server started (PID: $!)"

      - name: Start RIFT server
        run: |
          cd ${{ github.workspace }}
          ./rift-server > /tmp/rift_server.log 2>&1 &
          SERVER_PID=$!
          sleep 2
          echo "RIFT server started (PID: $SERVER_PID)"
          ps aux | grep rift-server | grep -v grep || echo "WARNING: Server may have failed to start"

      - name: Start RIFT client tunnel
        run: |
          cd ${{ github.workspace }}
          ./rift-client expose 3000 > /tmp/rift_client.log 2>&1 &
          CLIENT_PID=$!
          sleep 2
          echo "RIFT client started (PID: $CLIENT_PID)"
          ps aux | grep rift-client | grep -v grep || echo "WARNING: Client may have failed to start"

      - name: Run test suite
        run: |
          cd ${{ github.workspace }}
          python3 tests/test_tunnel.py > /tmp/test_results.txt 2>&1
          TEST_EXIT_CODE=$?
          cat /tmp/test_results.txt
          
          # Check for success
          if grep -q "RESULTS: 6/6 tests passed" /tmp/test_results.txt; then
            echo "✓ All 6 tests PASSED"
            exit 0
          else
            echo "✗ Tests FAILED or incomplete"
            exit 1
          fi

      - name: Generate test report
        if: always()
        run: |
          mkdir -p ${{ github.workspace }}/test-reports
          
          # Copy test results
          cp /tmp/test_results.txt ${{ github.workspace }}/test-reports/test_results.txt
          
          # Create detailed report
          cat > ${{ github.workspace }}/test-reports/REPORT.md << 'EOF'
          # RIFT Test Report
          
          ## Build Information
          - **Timestamp**: $(date)
          - **Runner**: ${{ runner.os }} - ${{ runner.arch }}
          - **Python Version**: $(python --version)
          
          ## Test Results
          
          EOF
          
          cat /tmp/test_results.txt >> ${{ github.workspace }}/test-reports/REPORT.md
          
          # Append server logs
          echo "" >> ${{ github.workspace }}/test-reports/REPORT.md
          echo "## Server Logs" >> ${{ github.workspace }}/test-reports/REPORT.md
          echo '```' >> ${{ github.workspace }}/test-reports/REPORT.md
          tail -50 /tmp/rift_server.log >> ${{ github.workspace }}/test-reports/REPORT.md
          echo '```' >> ${{ github.workspace }}/test-reports/REPORT.md
          
          echo "Test report generated"
          ls -lh ${{ github.workspace }}/test-reports/

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-reports/
            /tmp/test_results.txt
            /tmp/rift_server.log
            /tmp/rift_client.log
            /tmp/http_server.log
          retention-days: 30

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rift-binaries
          path: |
            rift-server
            rift-client
          retention-days: 90

      - name: Cleanup
        if: always()
        run: |
          pkill -f rift-server || true
          pkill -f rift-client || true
          pkill -f "http.server" || true
          sleep 1
          echo "Cleanup completed"

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for compilation warnings
        run: |
          cd ${{ github.workspace }}
          make clean
          make 2>&1 | tee /tmp/build_output.txt
          
          # Check for warnings (GCC with -Wextra -Werror)
          if grep -i "warning\|error" /tmp/build_output.txt; then
            echo "⚠ Compiler warnings detected"
            exit 1
          else
            echo "✓ Clean build (no warnings)"
            exit 0
          fi

      - name: Code style check
        run: |
          # Basic checks for C code
          echo "Checking for trailing whitespace..."
          if find server client -name "*.c" -o -name "*.h" | xargs grep -l ' $'; then
            echo "⚠ Trailing whitespace found"
            exit 1
          fi
          echo "✓ No trailing whitespace"

  performance-check:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build binaries
        run: |
          cd ${{ github.workspace }}
          make clean && make

      - name: Check binary sizes
        run: |
          echo "## Binary Sizes"
          ls -lh rift-server rift-client
          
          SIZE_SERVER=$(stat -f%z rift-server 2>/dev/null || stat -c%s rift-server)
          SIZE_CLIENT=$(stat -f%z rift-client 2>/dev/null || stat -c%s rift-client)
          
          echo "Server: $SIZE_SERVER bytes"
          echo "Client: $SIZE_CLIENT bytes"
          
          # Warn if binaries are unexpectedly large
          if [ "$SIZE_SERVER" -gt 500000 ]; then
            echo "⚠ Server binary is large (>500KB)"
          fi

      - name: Verify startup performance
        run: |
          cd ${{ github.workspace }}
          
          echo "Testing server startup..."
          time ./rift-server &
          sleep 3
          pkill -f rift-server || true
          echo "✓ Server started successfully"

  summary-job:
    runs-on: ubuntu-latest
    needs: [ build-and-test, code-quality, performance-check ]
    if: always()
    
    steps:
      - name: Test Summary
        run: |
          echo "## Test Execution Summary"
          echo "- Build & Test: ${{ needs.build-and-test.result }}"
          echo "- Code Quality: ${{ needs.code-quality.result }}"
          echo "- Performance: ${{ needs.performance-check.result }}"
          
          if [ "${{ needs.build-and-test.result }}" = "success" ]; then
            echo "✓ All checks passed!"
            exit 0
          else
            echo "✗ Some checks failed"
            exit 1
          fi
